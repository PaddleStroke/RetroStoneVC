# RetroStone Arcade (the full, paid app): its identity, read like app.conf (the free app's) by build.sh, Gradle,
# the launcher and the desktop bundle build: apps/android/build.sh full, make -f apps/launcher/bundle.mk
# CONF=apps/android/app-full.conf. Plain KEY=value lines, no quotes; '#' starts a comment line.
#
# APP_ID (the Android package id) is PERMANENT once the app is on Google Play: the free app's "Get the full version"
# button opens it (PAID_APP_ID in app.conf: keep the two the same).

PROFILE=full
# the name under the icon, in the launcher's header and on the desktop window (working title)
APP_NAME=RetroStone Arcade
# the Android package id (applicationId)
APP_ID=com.eightbcraft.retrostonearcade
# the version shown to users, and the number Google Play requires to grow with every upload
APP_VERSION_NAME=1.0.0
APP_VERSION_CODE=1

# no paid app to advertise: no "full version" banner, no panel
PAID_APP_NAME=
PAID_APP_ID=
PAID_STORE_URL=

# every game of games/ (with a docs/screenshots/title.png) is playable, in the order of their names
FREE_GAMES=all
# games never shown
HIDDEN_GAMES=bombermole
# the desktop exe: dist/windows/<EXE_NAME>.exe
EXE_NAME=RetroStoneArcade
# the icon's four heroes, 2 x 2 (apps/android/tools/make_icon.py: HEROES has their close-ups)
ICON_GAMES=crabcoconut frogreach spiderswing otterrapids
