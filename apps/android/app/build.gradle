// RetroStone Arcade (free and full) and RetroStone Board: the app module, for every app. The app's identity (name,
// package id, version) comes from its .conf: RSA_CONF (set by ../build.sh: ../app.conf, the free app, ../app-full.conf,
// the paid one, ../app-board.conf, the board games); the native libraries (libSDL2.so, libmain.so) and the icons are
// built by ../build.sh into RSA_OUT (build/android/<free|full|board>); the Java side is SDL's (org.libsdl.app, from the
// SDL2 source release in build/deps) and the app's Activity: ArcadeActivity (src/main/java), or the .conf's ACTIVITY
// in its JAVA_SRC folder. The .conf keys JAVA_SRC, ACTIVITY, ORIENTATION, PLAY_REVIEW default to the Arcade's.
plugins {
    id 'com.android.application'
}

def repo = file("$rootDir/../..")
def conf = new Properties()
file(System.getenv("RSA_CONF") ?: "$rootDir/app.conf").withReader('UTF-8') { conf.load(it) }
def out = new File(System.getenv("RSA_OUT") ?: new File(repo, "build/android/free").path)
def sdlJava = new File(repo, "build/deps/src/SDL2-2.32.10/android-project/app/src/main/java")
def appJava = conf.getProperty('JAVA_SRC') ? new File(repo, conf.getProperty('JAVA_SRC')) : file('src/main/java')
def playReview = conf.getProperty('PLAY_REVIEW', '1') == '1'
// the build output stays out of the sources: build/android/<free|full>/gradle/app
layout.buildDirectory = new File(out, "gradle/app")

// The upload key (never in the repository): a properties file with storeFile, storePassword, keyAlias, keyPassword,
// by default ~/.retrostone-keys/arcade.properties (RSA_SIGNING=<file> to use another; apps/android/make-keystore.sh
// writes it). See README.md, "Publishing". Without it the release outputs are unsigned (build.sh refuses --release).
def signing = new Properties()
def signingFile = new File(System.getenv("RSA_SIGNING") ?: "${System.getProperty("user.home")}/.retrostone-keys/arcade.properties")
if (signingFile.exists()) signingFile.withReader("UTF-8") { signing.load(it) }

android {
    namespace = 'com.eightbcraft.retrostonearcade'
    compileSdk = 36
    ndkVersion = '27.3.13750724'

    defaultConfig {
        applicationId = conf.getProperty('APP_ID')
        minSdk = 24                 // Android 7.0: Google Play's automatic protection needs 24 at least
        targetSdk = 36
        versionCode = conf.getProperty('APP_VERSION_CODE') as int
        versionName = conf.getProperty('APP_VERSION_NAME')
        resValue 'string', 'app_name', conf.getProperty('APP_NAME')
        // the Activity and its orientation (AndroidManifest.xml): the Arcade's unless the .conf says otherwise
        manifestPlaceholders = [
            activity: conf.getProperty('ACTIVITY', 'com.eightbcraft.retrostonearcade.ArcadeActivity'),
            orientation: conf.getProperty('ORIENTATION', 'sensorLandscape'),
        ]
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }
    buildFeatures {
        resValues = true                // the app name from the .conf
    }
    sourceSets {
        main {
            java.srcDirs = [appJava, sdlJava]
            jniLibs.srcDirs = [new File(out, "jniLibs")]
            res.srcDirs += [new File(out, "res")]
        }
    }
    signingConfigs {
        if (signing.getProperty("storeFile")) {
            release {
                storeFile = new File(signing.getProperty("storeFile"))
                storePassword = signing.getProperty("storePassword")
                keyAlias = signing.getProperty("keyAlias")
                keyPassword = signing.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.findByName("release")     // null (unsigned) without the file
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    // the Google Play In-App Review API (ArcadeActivity.requestReview), under the Play Core SDK Terms of Service; it
    // brings Play services basement and tasks (Android SDK licence) and a few AndroidX libraries (Apache 2.0): all in
    // the app's Credits & licences (apps/launcher/tools/gen_credits.py, PLAY_REVIEW: keep the version there in step)
    // (the Arcade apps only: PLAY_REVIEW=0 leaves it out, RetroStone Board)
    if (playReview) implementation 'com.google.android.play:review:2.0.2'
}
