# RetroStone Arcade Free: the ONE file with the app's identity (read by build.sh, Gradle, the launcher and the
# desktop bundle build). Plain KEY=value lines, no quotes; '#' starts a comment line.
#
# Change APP_NAME freely. APP_ID (the Android package id) is PERMANENT once the app is on Google Play: choose it
# before the first upload. PAID_APP_ID is the package id of the paid app (a placeholder until it exists): the
# "Get the full version" button opens market://details?id=<PAID_APP_ID>, or PAID_STORE_URL when the phone has no
# Play Store.

# the name under the icon, in the launcher's header and on the desktop window
APP_NAME=RetroStone Arcade Free
# the Android package id (applicationId)
APP_ID=com.eightbcraft.retrostonearcade.free
# the version shown to users, and the number Google Play requires to grow with every upload
APP_VERSION_NAME=0.1.0
APP_VERSION_CODE=1

# the paid app (placeholders)
PAID_APP_NAME=RetroStone Arcade
PAID_APP_ID=com.eightbcraft.retrostonearcade
PAID_STORE_URL=https://play.google.com/store/apps/details?id=com.eightbcraft.retrostonearcade

# the games playable in this app (games/<id>/), in menu order; every other game of games/ is shown LOCKED
FREE_GAMES=leadysquid pancaketower beaverrush
# games never shown (neither playable nor locked)
HIDDEN_GAMES=bombermole
# the desktop exe: dist/windows/<EXE_NAME>.exe
EXE_NAME=RetroStoneArcadeFree
