# RetroStone Board: the board games app's identity (apps/boardgames: two players on one device), read by build.sh
# and Gradle like app.conf and app-full.conf (the RetroStone Arcade apps): apps/android/build.sh board.
# Plain KEY=value lines, no quotes; '#' starts a comment line.
#
# APP_ID (the Android package id) is PERMANENT once the app is on Google Play: a new app, not one of the Arcade's.

PROFILE=board
# the name under the icon
APP_NAME=RetroStone Board
# the Android package id (applicationId)
APP_ID=com.eightbcraft.retrostoneboard
# the version shown to users, and the number Google Play requires to grow with every upload
APP_VERSION_NAME=1.0.0
APP_VERSION_CODE=1
# the files: dist/android/<EXE_NAME>-debug.apk (the desktop exe: dist/windows/RetroStoneBoard.exe, its Makefile)
EXE_NAME=RetroStoneBoard

# ---- what differs from the Arcade apps (each key's default is the Arcade's) --------------------------------------
# the native code: libmain.so from apps/boardgames/Makefile (make android ABI=<abi>); the Arcade's: launcher
# (apps/launcher/bundle.mk)
NATIVE=boardgames
# the Java side: SDL's and this folder's Activity (the Arcade's: apps/android/app/src/main/java, ArcadeActivity)
JAVA_SRC=apps/boardgames/android/java
ACTIVITY=com.eightbcraft.retrostoneboard.BoardActivity
# portrait and landscape, as the phone is held (the user's rotation lock respected); the Arcade: sensorLandscape.
# SDL then applies the app's SDL_HINT_ORIENTATIONS when it opens its window.
ORIENTATION=fullUser
# no Google Play review prompt (the Arcade's: 1, the In-App Review library and ArcadeActivity.requestReview)
PLAY_REVIEW=0
# the icon: the gold frame around the app's green table, its own knight, die and card (apps/android/tools/make_icon.py)
ICON_STYLE=board
