# RetroStone Board Free: the board games app's free edition, read by build.sh, Gradle and apps/boardgames/Makefile
# (EDITION=boardfree: tools/gen_edition.py) like app-board.conf (the paid app): apps/android/build.sh boardfree,
# make -f apps/boardgames/Makefile win64 EDITION=boardfree. Plain KEY=value lines, no quotes; '#' starts a comment line.
#
# APP_ID (the Android package id) is PERMANENT once the app is on Google Play: decided with the owner,
# com.eightbcraft.retrostoneboard.free (a new app of its own, beside the paid com.eightbcraft.retrostoneboard). The
# "full version" panel opens market://details?id=<PAID_APP_ID>, or PAID_STORE_URL when the phone has no Play Store
# (and on the desktop).

PROFILE=boardfree
# the name under the icon, and the desktop window's title
APP_NAME=RetroStone Board Free
# the Android package id (applicationId): permanent
APP_ID=com.eightbcraft.retrostoneboard.free
# the version shown to users, and the number Google Play requires to grow with every upload
APP_VERSION_NAME=1.0.0
APP_VERSION_CODE=1
# the files: dist/android/<EXE_NAME>-debug.apk, dist/windows/<EXE_NAME>.exe; also the desktop's save folder
EXE_NAME=RetroStoneBoardFree

# ---- what the free edition plays ---------------------------------------------------------------------------------
# every puzzle (the menu's Puzzles tab, peg solitaire too), its first FREE_LEVELS levels by number, no random play;
# and these games of the other tabs (their ids: apps/boardgames/src/games), with their bots and every variant. Every
# other game shows locked on its menu card, and a tap opens the "full version" panel. No code change needed.
FREE_GAMES=fourrow reversi draughts chess backgammon ludo yacht klondike freecells hearts crazyeights secretcode seabattle mapquiz
FREE_LEVELS=40

# the paid app: APP_NAME and APP_ID of app-board.conf (keep them the same)
PAID_APP_NAME=RetroStone Board
PAID_APP_ID=com.eightbcraft.retrostoneboard
PAID_STORE_URL=https://play.google.com/store/apps/details?id=com.eightbcraft.retrostoneboard

# ---- as app-board.conf ---------------------------------------------------------------------------------------------
NATIVE=boardgames
JAVA_SRC=apps/boardgames/android/java
ACTIVITY=com.eightbcraft.retrostoneboard.BoardActivity
ORIENTATION=fullUser
PLAY_REVIEW=0
ICON_STYLE=board
