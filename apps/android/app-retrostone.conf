# RetroStone: the one free app (the board games of apps/boardgames, and the Arcade's games in their tab), read by
# build.sh, Gradle and apps/boardgames/Makefile like app-board.conf: apps/android/build.sh retrostone,
# make -f apps/boardgames/Makefile win64 EDITION=retrostone. Plain KEY=value lines, no quotes; '#' starts a comment line.
#
# The app's identity, decided with the owner (16 October 2026), in this one place: APP_NAME and APP_ID.
# APP_ID (the Android package id) is PERMANENT once the app is on Google Play: a new app of its own, beside
# RetroStone Board (com.eightbcraft.retrostoneboard) and RetroStone Board Free.

PROFILE=retrostone
# the name under the icon, and the desktop window's title
APP_NAME=RetroStone
# the Android package id (applicationId): permanent
APP_ID=com.eightbcraft.retrostone
# the version shown to users (also at the bottom of the Settings page), and the number Google Play requires to grow
# with every upload
APP_VERSION_NAME=0.1.0
APP_VERSION_CODE=1
# the files: dist/android/<EXE_NAME>-debug.apk, dist/windows/<EXE_NAME>.exe; also the desktop's save folder
EXE_NAME=RetroStone

# ---- free: every game and every level, nothing locked ------------------------------------------------------------
FREE_GAMES=all
FREE_LEVELS=0

# ---- the Arcade tab: the RetroStone VC games, played in the app (apps/boardgames/src/arcade.h) ---------------------
# the Arcade's .conf whose catalogue the tab shows (tools/gen_arcade.py): every game of games/ with a
# docs/screenshots/title.png, a new one by itself at the next build
ARCADE=apps/android/app-full.conf
# the games the tab leaves out: this app's own list (not the Arcade app's HIDDEN_GAMES). Bomber Mole: no title picture.
ARCADE_HIDDEN=bombermole

# ---- the Settings page (apps/boardgames/tools/gen_edition.py) ----------------------------------------------------
# Leave a review: the app's store page (the Play Store app opens it on Android)
REVIEW_URL=https://play.google.com/store/apps/details?id=com.eightbcraft.retrostone
# Leave a tip: the store's consumable tip products (three tiers, apps/common/iap.h iap_tip_*), sold through the store's
# own billing where the build has a backend for it (Android: IAP=1 below; iOS: StoreKit, not yet). Empty: none.
TIP_PRODUCTS=com.eightbcraft.retrostone.tip1 com.eightbcraft.retrostone.tip2 com.eightbcraft.retrostone.tip3
# the Android build sells them through Google Play Billing (apps/common/iap_play.c and its Java class, the Billing
# Library: apps/android/app/build.gradle); the desktop builds sell nothing
IAP=1
# Leave a tip without a store backend (the desktop, F-Droid): a support page (Ko-fi, Patreon...). Undecided: empty, and
# the row is hidden when no store sells tips either.
SUPPORT_URL=
# Report a problem: a mail to us (or the GitHub issues page)
REPORT_URL=mailto:AppBugReport@8bcraft.com?subject=RetroStone
# Star on GitHub: the source code
SOURCE_URL=https://github.com/PaddleStroke/RetroStoneVC
# the privacy policy's web page (the Settings page shows its text in the app as well); empty: the in-app page only
PRIVACY_URL=https://www.8bcraft.com/privacy-policy-retrostone/

# ---- as app-board.conf ---------------------------------------------------------------------------------------------
NATIVE=boardgames
JAVA_SRC=apps/boardgames/android/java
ACTIVITY=com.eightbcraft.retrostoneboard.BoardActivity
ORIENTATION=fullUser
PLAY_REVIEW=0

# the icon: RetroStone Board's (the gold frame, the green table, the knight and the card) with an Arcade hero's pixels
# on a little screen in the die's place: the board games and the Arcade (apps/android/tools/make_icon.py,
# retrostone_icon)
ICON_STYLE=retrostone
