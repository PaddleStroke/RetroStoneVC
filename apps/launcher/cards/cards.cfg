# The launcher's game cards: one line per game, the moment of play its card shows (apps/launcher/README.md, "Cards").
#
#   <id>  <frame>  <x>,<y>  [<option>=<value> ...]  [sprite=<png>:<x>,<y>,<w>,<h>@<dx>,<dy> ...]
#
# tools/card_frames.sh plays the game headless at 1x (--opt bot=1 ready=1 seed=7 music=0 sound=0, then the line's
# options, which come first and win) and keeps the screen after <frame> as cards/<id>.png (320x240, committed);
# tools/gen_catalog.py cuts the card (96x72) out of it at <x>,<y>, pixel for pixel: never scaled. sprite= pastes a
# sprite of the game's art (a path in games/<id>/, magenta = clear) over the card at <dx>,<dy>, at 1x: for a scene
# that no single screen shows (Pancake Tower: the chef cheering by his stack). No HUD and no title logo in a card:
# the name is written under it. A game with no line (a new one) gets the middle of its title screen until it has one.
