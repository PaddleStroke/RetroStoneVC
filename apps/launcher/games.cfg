# RetroStone Arcade: what the app layer needs to know about each game (apps/launcher/tools/gen_catalog.py).
# The games' code is never changed: touches are turned into the virtual SNES pad here (player 1; players 2-4 use
# gamepads). The owner's target design for every game: apps/android/README.md, "Touch controls".
#
#   <game id | default>  key=value ...
#     touch=<zone>:<BUTTONS>   while a finger is in the zone, hold these buttons (several touch= keys: the first
#                              zone that contains the finger wins). Zones: all, left, right, top, bottom, or
#                              x0,y0,x1,y1 in percent of the screen (x1 and y1 excluded). Buttons: A B X Y L R UP
#                              DOWN LEFT RIGHT START SELECT, joined with +.
#     button=<zone>:<BUTTONS>  the same, and the frontend draws it: a translucent round button (an arrow, or the
#                              button's letter) in the zone, at its bottom when the zone is tall (at most 8 zones)
#     pause=<BUTTON>           what the small pause button in the corner presses (the game's pause input)
#     best=<offset>            the best score in the game's save RAM: a little-endian u16 at this offset
#                              (the house save layout: magic[4], version, pad[3], best -> 8; -1: none)
#     magic=<ABCD>             ... only when the save RAM starts with these 4 letters
#     shot=<file.png>          the picture of the "Get the full version" panel (docs/screenshots/; default: the
#                              first play screenshot)
# A game without a line uses "default".

default        touch=all:A                        pause=START   best=8

# ---- the free app's games (also in the full app) ----------------------------------------------------------------------------
# one button: a tap anywhere swims (A); Select pauses (Start is also a swim input in this game)
leadysquid     touch=all:A                        pause=SELECT  magic=LSQD
# one button: a tap anywhere drops the pancake
pancaketower   touch=all:A                        pause=START   magic=PTWR
# the left half of the screen gnaws on the left side, the right half on the right side
beaverrush     touch=left:LEFT touch=right:RIGHT  pause=START   magic=BVRU

# ---- the full app: the owner's schemes, app-level (final) ---------------------------------------------------------------------
# hold anywhere = A: the tongue grows / the hedgehog rolls / the mouse rises while the finger is down
frogreach      touch=all:A                        magic=FROG
hedgehoghills  touch=all:A                        magic=HHIL
mouseespresso  touch=all:A                        magic=MOUS
# tap anywhere = A: a jump / a flip to the other side of the vine
blueberrytumble touch=all:A                       magic=BBTM
snailswitch    touch=all:A                        magic=SNAI
# hold the left / right half of the screen = Left / Right
penguinslalom  touch=left:LEFT touch=right:RIGHT  magic=PENG
otterrapids    touch=left:LEFT touch=right:RIGHT  magic=OTTE
crabcoconut    touch=left:LEFT touch=right:RIGHT  magic=CRAB
# ... with A too: the only input that starts Biscuit Bandit from its title (A does nothing during a run)
biscuitbandit  touch=left:LEFT+A touch=right:RIGHT+A  magic=BSCT

# ---- the full app: PROVISIONAL fallbacks -----------------------------------------------------------------------------------------
# TODO(touch): the owner's design for these games is game-side (apps/android/README.md, "Touch controls": tap a spot,
# follow the finger, swipe up...): it needs the SDK's touch / pointer API, to come after the widescreen work. Until
# then, drawn buttons or screen zones that give the pad's buttons, to be tuned after the owner's phone test.
# Duck Parade: a D-pad drawn on the left half (up, down, back, forward), A (hop forward) on the right half
duckparade     button=0,0,50,34:UP button=0,67,50,100:DOWN button=0,34,25,67:LEFT button=25,34,50,67:RIGHT button=50,0,100,100:A  pause=START  magic=DUCK
# Radish Rascals: the band of the screen on the side of the bed: top, bottom, left, right
radishrascals  button=25,0,75,40:UP button=25,60,75,100:DOWN button=0,0,25,100:LEFT button=75,0,100,100:RIGHT  magic=RADI
# Raccoon Recycler: the left / middle / right third chooses the left / centre / right branch (A: the title's start)
raccoonrecycler button=0,0,34,100:LEFT+A button=34,0,67,100:UP+A button=67,0,100,100:RIGHT+A  magic=RCRC
# Moth Around: the left / right half steers
motharound     touch=left:LEFT touch=right:RIGHT  magic=MOTH
# Nutty Branch, Pogo Mamie, Mole Marbles, Spider Swing: Left and Right drawn on the left half, A on the right half
nuttybranch    button=0,0,22,100:LEFT button=22,0,44,100:RIGHT button=56,0,100,100:A  magic=NUTB
pogomamie      button=0,0,22,100:LEFT button=22,0,44,100:RIGHT button=56,0,100,100:A  magic=PMAM
molemarbles    button=0,0,22,100:LEFT button=22,0,44,100:RIGHT button=56,0,100,100:A  magic=MOLE
spiderswing    button=0,0,22,100:LEFT button=22,0,44,100:RIGHT button=56,0,100,100:A  magic=SPDR
