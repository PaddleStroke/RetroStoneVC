# RetroStone Arcade: what the app layer needs to know about each game (apps/launcher/tools/gen_catalog.py).
# The games' code is never changed: touches are turned into the virtual SNES pad here.
#
#   <game id | default>  key=value ...
#     touch=<zone>:<BUTTONS>   while a finger is in the zone, hold these buttons (several touch= keys: the first
#                              zone that contains the finger wins). Zones: all, left, right, top, bottom, or
#                              x0,y0,x1,y1 in percent of the screen (x1 and y1 excluded). Buttons: A B X Y L R UP
#                              DOWN LEFT RIGHT START SELECT, joined with +.
#     pause=<BUTTON>           what the small pause button in the corner presses (the game's pause input)
#     best=<offset>            the best score in the game's save RAM: a little-endian u16 at this offset
#                              (the house save layout: magic[4], version, pad[3], best -> 8; -1: none)
#     magic=<ABCD>             ... only when the save RAM starts with these 4 letters
#     shot=<file.png>          the picture of the "Get the full version" panel (docs/screenshots/; default: the
#                              first play screenshot)
# A game without a line uses "default". Add a line when a paid game needs another scheme.

default        touch=all:A                        pause=START   best=8

# one button: a tap anywhere swims (A); Select pauses (Start is also a swim input in this game)
leadysquid     touch=all:A                        pause=SELECT  magic=LSQD
# one button: a tap anywhere drops the pancake
pancaketower   touch=all:A                        pause=START   magic=PTWR
# the left half of the screen gnaws on the left side, the right half on the right side
beaverrush     touch=left:LEFT touch=right:RIGHT  pause=START   magic=BVRU
