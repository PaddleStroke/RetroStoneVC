# RetroStone Board for iPhone and iPad: ONE free app; an in-app purchase (a non-consumable, "unlock everything")
# opens every game and every level at once. Read by apps/ios/prepare.sh and apps/ios/build.sh. Plain KEY=value lines,
# no quotes; '#' starts a comment line.
#
# BUNDLE_ID and IAP_PRODUCT are PERMANENT once the app is on the App Store (App Store Connect: the app's bundle id,
# its in-app purchase's product id). The same id as the paid Android app: the two stores are separate.

APP_NAME=RetroStone Board
BUNDLE_ID=com.eightbcraft.retrostoneboard
IAP_PRODUCT=com.eightbcraft.retrostoneboard.unlock
# the app's numeric id on the App Store (App Store Connect, App Information: Apple ID), for Settings, Leave a
# review; empty: no such row
APPSTORE_ID=
# the save folder (SDL_GetPrefPath: Library/Application Support/8BCraft/<EXE_NAME>) and the Xcode target's name
EXE_NAME=RetroStoneBoard
# the version shown to users: APP_VERSION_NAME of this .conf (the build number: the CI run's number, else
# APP_VERSION_CODE; App Store Connect wants it to grow with every upload of a version)
VERSION_FROM=apps/android/app-board.conf
# what plays before the purchase: FREE_GAMES and FREE_LEVELS of the Android free edition (one list to keep)
FREE_FROM=apps/android/app-boardfree.conf
# the icon: the Android paid app's (make_icon.py, ICON_STYLE of this .conf)
ICON_FROM=apps/android/app-board.conf
