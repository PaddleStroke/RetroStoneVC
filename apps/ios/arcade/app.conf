# RetroStone Arcade for iPhone and iPad: ONE free app; an in-app purchase (a non-consumable, "unlock everything")
# opens every game at once. Read by apps/ios/prepare.sh and apps/ios/build.sh. Plain KEY=value lines, no quotes; '#'
# starts a comment line.
#
# BUNDLE_ID and IAP_PRODUCT are PERMANENT once the app is on the App Store (App Store Connect: the app's bundle id,
# its in-app purchase's product id). The same id as the paid Android app: the two stores are separate.

APP_NAME=RetroStone Arcade
BUNDLE_ID=com.eightbcraft.retrostonearcade
IAP_PRODUCT=com.eightbcraft.retrostonearcade.unlock
# the Xcode target's name
EXE_NAME=RetroStoneArcade
# the version shown to users: APP_VERSION_NAME of this .conf (the build number: the CI run's number, else
# APP_VERSION_CODE)
VERSION_FROM=apps/android/app-full.conf
# what plays before the purchase, and the games never shown: FREE_GAMES and HIDDEN_GAMES of the Android free app
FREE_FROM=apps/android/app.conf
# the icon: the Android paid app's (make_icon.py: its ICON_GAMES on the ruby tile)
ICON_FROM=apps/android/app-full.conf
